<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Friday Night Legacy — Playable Draft</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f5f8;font:15px system-ui,-apple-system,sans-serif}header{padding:17px 16px;background:#1c293b;border-bottom:2px solid #d5a83b}h1{font-size:21px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{margin:10px 0}p{line-height:1.5;color:#c5cbd7}.wrap{max-width:760px;margin:auto;padding:16px 16px 95px}.card{background:#1c293b;border:1px solid #39465a;border-radius:12px;padding:15px;margin-bottom:13px}.muted{color:#abb5c6}.gold{color:#f0c55b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#101827;padding:11px;border-radius:9px}.stat strong{display:block;font-size:21px}.stat small{color:#b4bdcd}button,input,select{font:inherit}button{border:0;border-radius:9px;background:#d5a83b;color:#15191f;font-weight:750;padding:12px 14px;cursor:pointer}button.secondary{background:#34445b;color:white}button:disabled{opacity:.4}input,select{width:100%;background:#101827;color:white;border:1px solid #64718a;border-radius:8px;padding:12px;margin:5px 0 12px}label{display:block;color:#d4dae4;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:#182437;display:flex;justify-content:space-around;border-top:1px solid #526077;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#bac5d4;font-size:11px;padding:8px 3px;flex:1}nav button.active{color:#f0c55b;background:#26354a}.bar{height:8px;background:#111b2c;border-radius:9px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;background:#d5a83b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}.row button{padding:7px 13px}.notice{background:#40351b;border:1px solid #866c2d;padding:12px;border-radius:8px;margin-bottom:12px}.entry{border-bottom:1px solid #354358;padding:9px 0}.entry:last-child{border:0}.pill{display:inline-block;padding:4px 8px;background:#304158;border-radius:15px;font-size:12px;margin:3px}.full{width:100%}textarea{width:100%;min-height:90px;background:#101827;color:white;border:1px solid #65748b;border-radius:8px;padding:10px}#fatal{display:none;background:#7f1d1d;padding:12px;color:white} @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><h1>🏈 FRIDAY NIGHT LEGACY <span class="gold">ALPHA 0.1</span></h1><div class="muted" style="font-size:12px">Offline football career simulator • No account required</div></header><div id="fatal"></div><main id="app" class="wrap"><div class="card">Loading game…</div></main><nav id="nav" hidden></nav><script>
'use strict';
(function(){
const KEY='fnl_chatgpt_draft_v1',ACT=['Position training','Strength','Speed','Film study','Academics','Recovery','Team bonding','Recruiting','Social life'],POSITIONS=['QB','RB','WR','TE','OL','DL','LB','CB','S','K'],MONTHS=['August','September','October','November','December','January','February','March','April','May','June','July'];
const el=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,tab='Home',allocation=Array(9).fill(0),message='',storageOK=true;
function rng(){S.seed=(Math.imul(S.seed,1664525)+1013904223)>>>0;return S.seed/4294967296}function rand(a,b){return Math.floor(rng()*(b-a+1))+a}function choose(arr){return arr[rand(0,arr.length-1)]}function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}function load(){try{const d=localStorage.getItem(KEY);if(d){const v=JSON.parse(d);if(v&&v.version===1&&v.player&&Array.isArray(v.history))S=v}}catch(e){storageOK=false}}
function stage(){return S.phase==='HS'?['Freshman','Sophomore','Junior','Senior'][S.level]:S.phase==='College'?['Freshman','Sophomore','Junior','Senior'][S.level]:S.phase==='Pro'?'Professional':'Retired'}function when(){return MONTHS[S.turn%12]+' '+(2027+Math.floor(S.turn/12))}
const POSITION_STATS={
QB:[['passAtt','Pass attempts'],['passCmp','Completions'],['passYds','Passing yards'],['passTD','Passing TD'],['int','Interceptions'],['rushAtt','Rush attempts'],['rushYds','Rushing yards'],['rushTD','Rushing TD']],
RB:[['rushAtt','Carries'],['rushYds','Rushing yards'],['rushTD','Rushing TD'],['rec','Receptions'],['recYds','Receiving yards'],['recTD','Receiving TD'],['fumbles','Fumbles']],
WR:[['targets','Targets'],['rec','Receptions'],['recYds','Receiving yards'],['recTD','Receiving TD'],['rushAtt','Rush attempts'],['rushYds','Rushing yards'],['drops','Drops']],
TE:[['targets','Targets'],['rec','Receptions'],['recYds','Receiving yards'],['recTD','Receiving TD'],['blocks','Key blocks'],['drops','Drops']],
OL:[['snaps','Snaps played'],['pancakes','Pancake blocks'],['sacksAllowed','Sacks allowed'],['penalties','Penalties']],
DL:[['tackles','Total tackles'],['tfl','Tackles for loss'],['sacks','Sacks'],['qbHits','QB hits'],['forcedFumbles','Forced fumbles']],
LB:[['tackles','Total tackles'],['tfl','Tackles for loss'],['sacks','Sacks'],['int','Interceptions'],['passesDefended','Passes defended'],['forcedFumbles','Forced fumbles']],
CB:[['tackles','Total tackles'],['int','Interceptions'],['passesDefended','Passes defended'],['targetsAllowed','Targets allowed'],['yardsAllowed','Yards allowed']],
S:[['tackles','Total tackles'],['int','Interceptions'],['passesDefended','Passes defended'],['tfl','Tackles for loss'],['forcedFumbles','Forced fumbles']],
K:[['fgAtt','Field goals attempted'],['fgMade','Field goals made'],['xpAtt','Extra points attempted'],['xpMade','Extra points made'],['longFG','Longest field goal']]
};
const ATTRIBUTE_WEIGHTS={QB:{Skill:.4,IQ:.35,Athleticism:.15,Strength:.1},RB:{Athleticism:.38,Skill:.35,Strength:.2,IQ:.07},WR:{Skill:.4,Athleticism:.38,IQ:.17,Strength:.05},TE:{Skill:.35,Strength:.32,Athleticism:.2,IQ:.13},OL:{Strength:.43,IQ:.32,Skill:.2,Athleticism:.05},DL:{Strength:.35,Athleticism:.25,Skill:.3,IQ:.1},LB:{IQ:.25,Strength:.25,Athleticism:.25,Skill:.25},CB:{Athleticism:.4,Skill:.35,IQ:.2,Strength:.05},S:{IQ:.3,Athleticism:.25,Skill:.3,Strength:.15},K:{Skill:.65,IQ:.3,Strength:.05}};
function ensureStats(){if(!S)return;const keys=POSITION_STATS[S.player.position]||POSITION_STATS.QB;for(const scope of ['season','career']){if(!S[scope])S[scope]={games:0};if(!S[scope].details)S[scope].details={};for(const [k] of keys)if(!Number.isFinite(S[scope].details[k]))S[scope].details[k]=0}if(!Array.isArray(S.boxScores))S.boxScores=[];if(!S.progressBank)S.progressBank={Skill:0,Strength:0,Athleticism:0,IQ:0}}
function statRows(scope){ensureStats();return '<div class="grid">'+POSITION_STATS[S.player.position].map(([k,label])=>'<div class="stat"><small>'+label+'</small><strong>'+S[scope].details[k]+'</strong></div>').join('')+'</div>'}
function addGameStats(d){ensureStats();for(const [k,v] of Object.entries(d)){if(k==='longFG'){S.season.details[k]=Math.max(S.season.details[k],v);S.career.details[k]=Math.max(S.career.details[k],v)}else{S.season.details[k]=(S.season.details[k]||0)+v;S.career.details[k]=(S.career.details[k]||0)+v}}}
function summaryLine(d){return POSITION_STATS[S.player.position].filter(([k])=>k!=='longFG').slice(0,4).map(([k,label])=>label+': '+(d[k]||0)).join(' • ')}
function boxScore(d){return '<div class="grid">'+POSITION_STATS[S.player.position].map(([k,label])=>'<div class="stat"><small>'+label+'</small><strong>'+(d[k]||0)+'</strong></div>').join('')+'</div>'}
function generateBoxScore(usage){const p=S.player.position,a=S.attrs,skill=(a.Skill-45)/100,iq=(a.IQ-45)/100,ath=(a.Athleticism-45)/100,str=(a.Strength-45)/100;const n=(lo,hi)=>rand(lo,hi),volume=(x)=>Math.max(0,Math.round(x*usage));let d={};if(p==='QB'){d.passAtt=volume(n(20,37));d.passCmp=Math.min(d.passAtt,Math.round(d.passAtt*clamp(.46+skill*.3+iq*.18+rng()*.1,.35,.85)));d.passYds=Math.round(d.passCmp*(n(8,13)+skill*4));d.passTD=n(0,Math.max(1,Math.round(d.passYds/90)));d.int=rng()<clamp(.35-iq*.25,.08,.5)?n(1,2):0;d.rushAtt=volume(n(1,8));d.rushYds=Math.round(d.rushAtt*(n(2,6)+ath*3));d.rushTD=rng()<.12?1:0}
else if(p==='RB'){d.rushAtt=volume(n(10,24));d.rushYds=Math.round(d.rushAtt*(n(3,6)+ath*2+str));d.rushTD=n(0,Math.max(1,Math.round(d.rushYds/75)));d.rec=volume(n(0,5));d.recYds=Math.round(d.rec*n(5,12));d.recTD=rng()<.09?1:0;d.fumbles=rng()<.035?1:0}
else if(p==='WR'||p==='TE'){d.targets=volume(n(p==='WR'?5:3,p==='WR'?13:9));d.rec=Math.min(d.targets,Math.round(d.targets*clamp(.46+skill*.26+iq*.1+rng()*.14,.3,.91)));d.recYds=Math.round(d.rec*(n(8,15)+ath*4));d.recTD=n(0,Math.max(1,Math.round(d.recYds/95)));d.drops=Math.max(0,Math.round((d.targets-d.rec)*clamp(.18-skill*.1,.03,.25)));if(p==='WR'){d.rushAtt=volume(n(0,2));d.rushYds=d.rushAtt*n(2,12)}else d.blocks=volume(n(1,7))}
else if(p==='OL'){d.snaps=volume(n(40,74));d.pancakes=volume(n(0,5)+Math.max(0,Math.round(str*3)));d.sacksAllowed=rng()<clamp(.26-str*.25-iq*.12,.03,.35)?1:0;d.penalties=rng()<.11?1:0}
else if(p==='DL'){d.tackles=volume(n(2,8));d.tfl=volume(n(0,3));d.sacks=rng()<clamp(.25+skill*.25,.1,.5)?n(1,2):0;d.qbHits=d.sacks+n(0,2);d.forcedFumbles=rng()<.08?1:0}
else if(p==='LB'){d.tackles=volume(n(4,12));d.tfl=volume(n(0,3));d.sacks=rng()<.2?1:0;d.int=rng()<.08?1:0;d.passesDefended=n(0,2);d.forcedFumbles=rng()<.06?1:0}
else if(p==='CB'||p==='S'){d.tackles=volume(n(2,8));d.int=rng()<clamp(.09+skill*.1,.05,.19)?1:0;d.passesDefended=volume(n(0,3));if(p==='CB'){d.targetsAllowed=volume(n(2,9));d.yardsAllowed=Math.round(d.targetsAllowed*n(3,9)*clamp(1-skill*.5,.55,1))}else{d.tfl=n(0,2);d.forcedFumbles=rng()<.07?1:0}}
else {d.fgAtt=volume(n(1,4));d.fgMade=0;d.longFG=0;for(let i=0;i<d.fgAtt;i++){const distance=n(22,55);if(rng()<clamp(.8+skill*.3-(distance-30)*.009,.38,.96)){d.fgMade++;d.longFG=Math.max(d.longFG,distance)}}d.xpAtt=volume(n(1,5));d.xpMade=0;for(let i=0;i<d.xpAtt;i++)if(rng()<clamp(.91+skill*.12,.8,.99))d.xpMade++}
return d}

function overall(){const a=S.attrs,w=ATTRIBUTE_WEIGHTS[S.player.position]||ATTRIBUTE_WEIGHTS.QB;return Math.round(Object.entries(w).reduce((v,[k,weight])=>v+a[k]*weight,0))}
function careerLabel(){return S.phase==='HS'?S.player.school:S.phase==='College'?S.team:S.phase==='Pro'?S.team:'Retired'}
function create(){const name=el('name').value.trim(),school=el('school').value.trim(),town=el('town').value.trim();if(!name||!school||!town){alert('Enter a player name, hometown and school.');return}const pos=el('position').value,arch=el('archetype').value,diff=el('difficulty').value;S={version:1,seed:(Date.now()>>>0)||123456,turn:0,phase:'HS',level:0,team:school,player:{name,school,town,position:pos,archetype:arch,number:Math.floor(Math.random()*89)+1},attrs:{Athleticism:(Math.floor(Math.random()*(58-44+1))+44),Strength:(Math.floor(Math.random()*(56-42+1))+42),Skill:(Math.floor(Math.random()*(56-42+1))+42),IQ:(Math.floor(Math.random()*(58-44+1))+44)},fatigue:8,injury:0,gpa:3.1,trust:30,chemistry:40,morale:70,exposure:0,record:{w:0,l:0},season:{games:0,stat:0,td:0,extra:0},career:{games:0,stat:0,td:0,extra:0},history:[],news:['Your football journey begins. Earn your place on the depth chart.'],awards:[],offers:[],difficulty:diff,retired:false};if(arch==='Speedster')S.attrs.Athleticism+=9;if(arch==='Technician')S.attrs.Skill+=9;if(arch==='Powerhouse')S.attrs.Strength+=9;if(arch==='Field General')S.attrs.IQ+=9;allocation=Array(9).fill(0);tab='Home';persist();render()}
function log(t){S.history.unshift({date:when(),text:t});S.history=S.history.slice(0,250);S.news.unshift(t);S.news=S.news.slice(0,40)}function improve(k,n){S.attrs[k]=clamp(S.attrs[k]+n,25,99)}function game(){ensureStats();const ov=overall(),available=S.injury===0,usage=clamp((S.trust+12)/75,.3,1.12)*clamp(1-S.fatigue/180,.48,1);const opponent=rand(45,88)+(S.phase==='HS'?0:S.phase==='College'?8:15);const power=ov+(S.chemistry-50)*.09+(S.trust-50)*.07-S.fatigue*.11;const win=rng()<clamp(.5+(power-opponent)/100,.1,.9);const ours=win?rand(17,48):rand(6,30),theirs=win?rand(3,Math.max(6,ours-1)):rand(ours+1,ours+20);const d=available?generateBoxScore(usage):{};if(available)addGameStats(d);if(win)S.record.w++;else S.record.l++;S.season.games++;S.career.games++;S.fatigue=clamp(S.fatigue+rand(4,9),0,100);const performance=available?Math.round(usage*5)-2:-3;S.trust=clamp(S.trust+(win?1:-1)+performance,0,100);S.morale=clamp(S.morale+(win?2:-2)+(available?1:-2),0,100);const report=careerLabel()+' '+ours+'–'+theirs+' Opponent • '+(win?'WIN':'LOSS')+' • '+(available?summaryLine(d):'OUT (injury)');S.boxScores.unshift({date:when(),team:careerLabel(),ours,theirs,win,played:available,stats:d});S.boxScores=S.boxScores.slice(0,100);log(report);if(available&&rng()<.009+S.fatigue/2000){S.injury=rand(1,2);log('Injury setback: expected to miss '+S.injury+' month(s).')}return report}
function yearEnd(){const phase=S.phase,level=S.level;log(`Season finished: ${S.record.w}–${S.record.l}. ${summaryLine(S.season.details||{})}.`);if(S.record.w>=8&&overall()>=68){S.awards.unshift(`${2027+Math.floor(S.turn/12)}: All-Conference recognition`);log('Award earned: All-Conference recognition!')}S.record={w:0,l:0};S.season={games:0,stat:0,td:0,extra:0,details:{}};if(level<3){S.level++;log('Advanced to '+stage()+' year.');return}if(phase==='HS'){S.offers=generateOffers();if(!S.offers.length){S.offers=[{name:'Walk-on College',tier:1}]}S.phase='Recruiting';log('High school complete! Review your college offers in Career.')}else if(phase==='College'){S.phase='Draft';log('College career complete. Review professional options in Career.')}else if(phase==='Pro'){S.level++;if(S.level>=10){S.phase='Retired';S.retired=true;log('Your professional career is complete. Congratulations!')}else log('New professional season begins.')}}
function generateOffers(){const score=overall()+S.exposure*.2+S.gpa*2+S.trust*.1;const names=[['Bluegrass State',1],['Lakeview University',1],['Mountain Tech',2],['Coastal Atlantic',2],['Midwest State',3],['Gulf University',3],['National Power',4]];return names.filter((x,i)=>score>=50+x[1]*11&&rng()<clamp(.84-i*.07,.2,.9)).map(x=>({name:x[0],tier:x[1]}))}
function sim(){if(['Recruiting','Draft','Retired'].includes(S.phase))return;const total=allocation.reduce((a,b)=>a+b,0);if(total!==12){alert('Allocate exactly 12 points. Currently '+total+'/12.');return}ensureStats();const a=allocation,diff=S.difficulty==='Hard'?.8:S.difficulty==='Easy'?1.2:1;const training={Skill:a[0],Strength:a[1],Athleticism:a[2],IQ:a[3]};const gains=[];for(const [k,points] of Object.entries(training)){const old=S.attrs[k],fatiguePenalty=clamp(1-S.fatigue/170,.45,1),diminishing=clamp((105-old)/55,.15,1),gain=points*.58*diff*fatiguePenalty*diminishing;S.progressBank[k]=(S.progressBank[k]||0)+gain;const whole=Math.floor(S.progressBank[k]);S.progressBank[k]-=whole;improve(k,whole);if(S.attrs[k]>old)gains.push(k+' +'+(S.attrs[k]-old))}S.gpa=clamp(S.gpa+a[4]*.055-.035,1,4);S.fatigue=clamp(S.fatigue+5+a[0]*1.5+a[1]*2+a[2]*2-a[5]*9,0,100);S.chemistry=clamp(S.chemistry+a[6]*3-1,0,100);S.exposure=clamp(S.exposure+a[7]*3+(S.phase==='HS'&&S.level>1?2:0),0,100);S.morale=clamp(S.morale+a[8]*3+(a[5]>1?2:0)-2,0,100);S.trust=clamp(S.trust+a[0]+a[3]+a[6]-1,0,100);if(S.injury>0){S.injury=Math.max(0,S.injury-(a[5]>=2?2:1));log('Rehab month: '+(S.injury===0?'cleared to return.':'still recovering.'))}else if(S.fatigue>85&&rng()<.12){S.injury=1;log('Overtraining caused a minor injury.')}const m=S.turn%12;if(m<=3){const n=m===0?2:3;for(let i=0;i<n;i++)game()}else log('Offseason development: '+overall()+' OVR, GPA '+S.gpa.toFixed(2)+'.');if(gains.length)log('Training progress: '+gains.join(', '));S.turn++;if(S.turn%12===0)yearEnd();allocation=Array(9).fill(0);persist();tab='Home';render()}
function commit(i){if(S.phase!=='Recruiting'||!S.offers[i])return;S.team=S.offers[i].name;S.phase='College';S.level=0;S.trust=25;S.exposure=0;S.turn=Math.ceil(S.turn/12)*12;log('Committed to '+S.team+'! College freshman season begins.');persist();render()}function draft(){if(S.phase!=='Draft')return;const rating=overall();if(rating<65){S.phase='Retired';S.retired=true;log('Professional scouts passed. You retire after college.');persist();render();return}S.team=choose(['Louisville Stallions','Chicago Guardians','Dallas Outlaws','Seattle Thunder','Miami Sharks','Denver Summit']);S.phase='Pro';S.level=0;S.trust=rating>82?45:18;S.turn=Math.ceil(S.turn/12)*12;log('Signed by the '+S.team+'! Welcome to professional football.');persist();render()}
function card(t,html){return `<section class="card"><h2>${t}</h2>${html}</section>`}function stats(){return `<div class="grid">${[['Overall',overall()],['Position',S.player.position],['Trust',S.trust],['Fatigue',S.fatigue+'%'],['GPA',S.gpa.toFixed(2)],['Morale',S.morale],['Chemistry',S.chemistry],['Exposure',S.exposure],['Career Games',S.career.games]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>`}
function startUI(){el('nav').hidden=true;el('app').innerHTML=card('Create your football career',`<p>Start at age 14 as a high school freshman. Every turn represents one month.</p><label>Player name<input id="name" value="Jensen Heart" maxlength="40"></label><label>Hometown<input id="town" value="Louisville, Kentucky" maxlength="60"></label><label>High school<input id="school" value="Central High" maxlength="60"></label><label>Position<select id="position">${POSITIONS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Archetype<select id="archetype"><option>Balanced</option><option>Speedster</option><option>Technician</option><option>Powerhouse</option><option>Field General</option></select></label><label>Difficulty<select id="difficulty"><option>Normal</option><option>Hard</option><option>Easy</option></select></label><button class="full" id="create">Start career</button>`);el('create').onclick=create}
function home(){return card('Career dashboard',`<p class="gold"><b>${esc(S.player.name)}</b> • #${S.player.number} • ${esc(S.player.position)}</p><p>${esc(careerLabel())} • ${stage()} • ${when()}</p>${stats()}<p>${S.injury?'🩹 Injured — '+S.injury+' month(s) remaining':'✓ Available to play'} • Record ${S.record.w}–${S.record.l}</p><button class="full" data-tab="Plan">Plan next month</button>`)+card('Latest headlines',S.news.slice(0,5).map(x=>`<div class="entry">${esc(x)}</div>`).join(''))}
function player(){ensureStats();const w=ATTRIBUTE_WEIGHTS[S.player.position];return card('Player development',`<p>${esc(S.player.name)} • ${esc(S.player.archetype)} • ${S.player.position} • ${overall()} OVR</p><p class="muted">Position-weighted attributes. Training gains build over time; high ratings develop more slowly.</p>${Object.entries(S.attrs).map(([k,v])=>`<div class="row"><b>${k} <small class="muted">(${Math.round((w[k]||0)*100)}% OVR weight)</small></b><b>${v}/99</b></div><div class="bar"><i style="width:${v}%"></i></div><small class="muted">Progress toward next point: ${Math.round((S.progressBank[k]||0)*100)}%</small>`).join('')}`)+card('Player condition',stats())}
function plan(){if(S.phase==='Recruiting')return card('Decision required','<p>Choose a college offer in Career before continuing.</p><button data-tab="Career">View offers</button>');if(S.phase==='Draft')return card('Decision required','<p>Review your professional future in Career.</p><button data-tab="Career">Go to career</button>');if(S.retired)return card('Career complete','<p>Your career is finished. You can review your history or start again in Settings.</p>');let left=12-allocation.reduce((a,b)=>a+b,0);return card('Monthly training plan',`<p>${when()} • <b class="gold">${left} / 12 points remaining</b></p><p>Spend exactly 12 points. Training raises attributes; recovery manages fatigue; academics and exposure shape recruiting.</p>${ACT.map((x,i)=>`<div class="row"><div><b>${x}</b><div class="muted" style="font-size:12px">${['Improve technique','Increase power','Increase athleticism','Improve football IQ','Protect GPA','Reduce fatigue and speed rehab','Build team chemistry','Attract college scouts','Improve morale'][i]}</div></div><div style="display:flex;align-items:center;gap:8px"><button class="secondary" data-minus="${i}" ${allocation[i]===0?'disabled':''}>−</button><b>${allocation[i]}</b><button class="secondary" data-plus="${i}" ${left===0?'disabled':''}>+</button></div></div>`).join('')}<button class="full" id="sim" ${left!==0?'disabled':''}>Simulate ${when()}</button>`)}
function games(){ensureStats();return card('Current season',`<div class="grid"><div class="stat"><small>Team record</small><strong>${S.record.w}–${S.record.l}</strong></div><div class="stat"><small>Games played</small><strong>${S.season.games}</strong></div></div><h3>${S.player.position} statistics</h3>${statRows('season')}`)+card('Recent game box scores',S.boxScores.slice(0,12).map(x=>`<div class="entry"><b>${esc(x.date)}</b> • ${x.win?'WIN':'LOSS'} ${x.ours}–${x.theirs}<p>${x.played?summaryLine(x.stats):'Did not play (injury)'}</p>${x.played?boxScore(x.stats):''}</div>`).join('')||'<p>No games yet. Simulate August to start the season.</p>')}
function career(){ensureStats();let decision='';if(S.phase==='Recruiting')decision=card('Choose your college',`<p>These are the programs that offered you a place. Your choice is permanent in this draft.</p>${S.offers.map((o,i)=>`<div class="row"><div><b>${esc(o.name)}</b><div class="muted">Program tier ${o.tier}/4</div></div><button data-offer="${i}">Commit</button></div>`).join('')}`);if(S.phase==='Draft')decision=card('Professional evaluation',`<p>Your overall rating is ${overall()}. Scouts typically require 65+ OVR in this alpha.</p><button id="draft" class="full">Enter pro draft / evaluate</button>`);return decision+card('Career totals',`<p>${esc(S.player.name)} • ${S.phase} • ${stage()}</p><p>Games: <b>${S.career.games}</b></p>${statRows('career')}`)+card('Awards',S.awards.length?S.awards.map(x=>`<div class="entry">🏆 ${esc(x)}</div>`).join(''):'<p>No awards yet.</p>')+card('Career journal',S.history.slice(0,30).map(x=>`<div class="entry"><small class="gold">${esc(x.date)}</small><div>${esc(x.text)}</div></div>`).join('')||'<p>Career just started.</p>')}
function world(){return card('Football world',`<p>Current school/team: <b>${esc(careerLabel())}</b></p><p>Development is affected by position, performance, training, team trust, and fatigue. The world currently uses simplified fictional opponents and teams.</p><p><b>Career phase:</b> ${S.phase} • <b>Year:</b> ${stage()}</p>`)+card('News feed',S.news.slice(0,25).map(x=>`<div class="entry">${esc(x)}</div>`).join(''))}
function settings(){return card('Save & backup',`<p>Progress saves automatically in this browser. Export a backup before clearing browser data.</p><button id="export" class="full">Download save JSON</button><p><label>Import a save file<input type="file" id="import" accept="application/json,.json"></label></p>${storageOK?'':'<div class="notice">Browser storage is unavailable. Export saves regularly.</div>'}`)+card('New career',`<p>Starting over permanently replaces the current browser save. Export first if you want to keep it.</p><button class="secondary full" id="reset">Delete career and restart</button>`)}
function render(){if(S)ensureStats();if(!S){startUI();return}el('nav').hidden=false;const tabs=['Home','Player','Plan','Games','Career','World','Settings'];el('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t}" class="${tab===t?'active':''}">${['⌂','★','✎','🏈','🏆','◎','⚙'][i]}<br>${t}</button>`).join('');el('app').innerHTML=({Home:home,Player:player,Plan:plan,Games:games,Career:career,World:world,Settings:settings})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.plus;if(allocation.reduce((a,b)=>a+b,0)<12)allocation[i]++;render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.minus;if(allocation[i]>0)allocation[i]--;render()});document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>commit(+b.dataset.offer));if(el('sim'))el('sim').onclick=sim;if(el('draft'))el('draft').onclick=draft;if(el('reset'))el('reset').onclick=()=>{if(confirm('Delete this career? Export a backup first if needed.')){try{localStorage.removeItem(KEY)}catch(e){}S=null;tab='Home';render()}};if(el('export'))el('export').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='friday-night-legacy-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if(el('import'))el('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.version!==1||!d.player||!Array.isArray(d.history))throw Error('Not a valid draft save');if(confirm('Replace your current career with this save?')){S=d;allocation=Array(9).fill(0);persist();tab='Home';render()}}catch(e){alert('Could not import: '+e.message)}}}
window.addEventListener('error',e=>{const f=el('fatal');f.style.display='block';f.textContent='Game error: '+e.message+' — Refresh the page or export your save from Settings.'});load();render();
})();</script></body></html>
